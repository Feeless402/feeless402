[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "feeless402"
version = "0.2.1"
description = "Feeless x402 micropayments for AI agents — self-custodied XNO wallet, pay-per-call client, merchant server with railHint, faucet, and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["nanopy", "requests"]
keywords = ["x402", "micropayments", "ai-agents", "nano", "xno", "http-402", "mcp", "railhint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://feeless402.com"
Specification = "https://railhint.com"
Source = "https://github.com/feeless402/feeless402"

[project.optional-dependencies]
server = ["fastapi", "uvicorn[standard]"]
mcp = ["mcp>=2.0"]
all = ["fastapi", "uvicorn[standard]", "mcp>=2.0"]

[project.scripts]
nano-pay = "nano_pay.cli:main"
f402 = "nano_pay.cli:main"
feeless402 = "nano_pay.cli:main"

[tool.setuptools]
packages = ["nano_pay"]
